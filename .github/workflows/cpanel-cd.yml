name: Test, build and deploy cPanel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, xmlreader, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction
          npm ci
      - name: Security audits
        run: |
          composer audit --locked
          npm audit
      - name: Build production assets before rendering application tests
        run: npm run build
      - name: Application and deployment checks
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          php artisan test
          python3 -m unittest discover -s tests/deployment -v
      - name: Build isolated production dependencies and release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/cd/bundle.py --output dist/cd/release --release-id "$RELEASE_ID"
          python3 scripts/cd/deploy.py --bundle dist/cd/release --check
          python3 scripts/cd/rehearse.py --bundle dist/cd/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpanel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/cd/release/
          include-hidden-files: true # Includes .htaccess; bundle validation rejects .env/runtime data.
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy verified release
    needs: build
    # Explicitly armed later; PRs and local branches can never deploy.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CPANEL_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: production
      url: https://indonesiavanillas.com
    concurrency:
      group: vanilindo-cpanel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cpanel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/cd/release/
      - name: Validate downloaded artifact
        run: python3 scripts/cd/deploy.py --bundle dist/cd/release --check
      - name: Deploy with encrypted transfers and rollback
        env:
          CPANEL_FTPS_HOST: ${{ secrets.CPANEL_FTPS_HOST }}
          CPANEL_FTPS_USER: ${{ secrets.CPANEL_FTPS_USER }}
          CPANEL_FTPS_PASSWORD: ${{ secrets.CPANEL_FTPS_PASSWORD }}
          CPANEL_FTPS_PORT: ${{ vars.CPANEL_FTPS_PORT || '21' }}
          CPANEL_FTP_ROOT: ${{ vars.CPANEL_FTP_ROOT || '/' }}
        run: python3 scripts/cd/deploy.py --bundle dist/cd/release
